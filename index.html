<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Final</title>

    <style>
        body {
            margin: 0;
            background: #020617;
            font-family: Arial;
            overflow: hidden;
        }

        video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 240px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid white;
        }

        .overlay {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
        }

        .role {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .text-box {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(30, 41, 59, 0.9));
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 90%;
        }

        .text {
            font-size: 30px;
            font-weight: bold;
            color: white;
        }

        .word {
            opacity: 0.3;
        }

        .active {
            opacity: 1;
            color: #22c55e;
        }

        .timer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 35px;
            color: white;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .start {
            background: linear-gradient(135deg, #22c55e, #4ade80);
            color: black;
        }

        .stop {
            background: linear-gradient(135deg, #ef4444, #f87171);
            color: white;
        }

        .record {
            background: linear-gradient(135deg, #eab308, #facc15);
            color: black;
        }

        .countdown {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            font-size: 80px;
            color: white;
        }
    </style>
</head>

<body>

    <video id="video" autoplay muted playsinline></video>

    <div class="overlay">
        <div class="role" id="role"></div>
        <div class="text-box">
            <div class="text" id="text"></div>
        </div>
    </div>

    <div class="timer" id="timer">0</div>

    <div class="controls">
        <button class="start" onclick="start()">Iniciar</button>
        <button class="stop" onclick="stop()">Detener</button>
        <button class="record" onclick="rec()">Grabar</button>
    </div>

    <div class="countdown" id="countdown"></div>

    <script>
        const script = [
            { role: "Daniela", text: "Hi, my name is Daniela and today I’m going to talk about my travel experience.", time: 6 },
            { role: "Aldemar", text: "Hi, my name is Aldemar and today I’m going to talk about my travel experience too.", time: 6 },
            { role: "Daniela", text: "Aldemar, what was the most unforgettable trip you had?", time: 4 },
            { role: "Aldemar", text: "My most unforgettable trip was when I went to Medellín with my cousins last year. We traveled by bus and visited many tourist places.", time: 9 },
            { role: "Daniela", text: "Wow! How was the trip?", time: 3 },
            { role: "Aldemar", text: "It was amazing, but we had a problem on the road because the bus got a flat tire. We waited for two hours.", time: 8 },
            { role: "Daniela", text: "Oh no! Did you have a good time anyway?", time: 4 },
            { role: "Aldemar", text: "Yes, I did. We went to museums, restaurants, and parks. What about you?", time: 6 },
            { role: "Daniela", text: "My unforgettable trip was when I went to Cartagena with my family. We stayed in a hotel near the beach.", time: 7 },
            { role: "Aldemar", text: "Did you have a nice flight?", time: 3 },
            { role: "Daniela", text: "Yes, I did, but the flight was delayed for one hour because of the weather.", time: 6 },
            { role: "Aldemar", text: "Was the hotel comfortable?", time: 3 },
            { role: "Daniela", text: "Yes, it was very comfortable and the food was delicious. We also went to the beach every afternoon.", time: 8 },
            { role: "Aldemar", text: "That sounds great! Why was the experience unforgettable for you?", time: 5 },
            { role: "Daniela", text: "Because I spent quality time with my family and I felt very happy and relaxed.", time: 7 },
            { role: "Aldemar", text: "Nice! In the future, I’m going to travel to Canada with my friends.", time: 6 },
            { role: "Daniela", text: "Really? I’m going to visit San Andrés next vacation.", time: 5 },
            { role: "Aldemar", text: "That sounds exciting!", time: 2 },
            { role: "Daniela", text: "Yes! Traveling is always a wonderful experience.", time: 4 },
            { role: "Aldemar", text: "Thank you for listening to our travel experiences.", time: 4 },
            { role: "Daniela", text: "Goodbye everyone!", time: 2 }
        ];

        let i = 0, interval, stream, recorder, chunks = [];
        const video = document.getElementById("video");

        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(s => { stream = s; video.srcObject = s; });

        function start() {
            countdown(3, () => { i = 0; next(); });
        }

        function countdown(sec, cb) {
            let el = document.getElementById("countdown");
            el.innerText = sec;
            let c = setInterval(() => {
                sec--;
                if (sec <= 0) { clearInterval(c); el.innerText = ""; cb(); }
                else el.innerText = sec;
            }, 1000);
        }

        function next() {
            if (i >= script.length) return;

            let line = script[i];
            document.getElementById("role").innerText = line.role;
            showText(line.text, line.time);

            let t = line.time;
            document.getElementById("timer").innerText = t;

            interval = setInterval(() => {
                t--;
                document.getElementById("timer").innerText = t;

                if (t <= 0) {
                    clearInterval(interval);
                    i++;
                    setTimeout(next, 500);
                }
            }, 1000);
        }

        function showText(text, time) {
            let words = text.split(" ");
            let container = document.getElementById("text");
            container.innerHTML = "";

            words.forEach(w => {
                let span = document.createElement("span");
                span.innerText = w + " ";
                span.classList.add("word");
                container.appendChild(span);
            });

            let spans = document.querySelectorAll(".word");
            let delay = (time * 1000) / words.length;

            spans.forEach((s, i) => {
                setTimeout(() => { s.classList.add("active"); }, i * delay);
            });
        }

        function stop() { clearInterval(interval); }

        function rec() {
            if (!recorder || recorder.state === "inactive") {
                chunks = [];
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = e => chunks.push(e.data);

                recorder.onstop = () => {
                    let blob = new Blob(chunks, { type: "video/webm" });
                    let a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = "video_final.webm";
                    a.click();
                };

                recorder.start();
                alert("Grabando...");
            } else {
                recorder.stop();
                alert("Video guardado");
            }
        }
    </script>

</body>

</html>
